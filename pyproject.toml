[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ebin"
version = "1.3.0"
description = "Posterior bin-expectation normalization for sorting-based MPRA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jax>=0.4", "numpy", "scipy", "pandas"]

[project.optional-dependencies]
netcdf = ["xarray", "h5netcdf"]
plots = ["matplotlib"]
hier = ["statsmodels"]
test = ["pytest"]
all = ["xarray", "h5netcdf", "matplotlib", "statsmodels"]

[project.scripts]
ebin = "ebin.__main__:main"

[tool.setuptools]
packages = ["ebin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
